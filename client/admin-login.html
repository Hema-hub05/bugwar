
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>BugWar | Admin Login</title>

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#05070f;
        }

        .login-card{
            width:100%;
            max-width:380px;
            background:rgba(16,24,47,.9);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:2.2rem 2rem;
        }

        .login-logo{
            text-align:center;
            font-size:1.4rem;
            font-weight:700;
            margin-bottom:.4rem;
        }

        .login-sub{
            text-align:center;
            color:var(--muted);
            font-size:.85rem;
            margin-bottom:1.6rem;
        }

        .login-field{
            margin-bottom:1.1rem;
        }

        .login-field label{
            display:block;
            font-size:.8rem;
            color:var(--muted);
            margin-bottom:.4rem;
        }

        .login-field input{
            width:100%;
            padding:.7rem .9rem;
            background:rgba(255,255,255,.04);
            border:1px solid var(--border);
            border-radius:10px;
            color:var(--white);
            font-size:.9rem;
        }

        .login-field input:focus{
            outline:none;
            border-color:var(--primary);
        }

        #loginBtn{
            width:100%;
            padding:.75rem;
            border:none;
            border-radius:10px;
            background:var(--primary);
            color:#fff;
            font-weight:600;
            font-size:.9rem;
            cursor:pointer;
            margin-top:.4rem;
        }

        #loginBtn:disabled{
            opacity:.6;
            cursor:not-allowed;
        }

        #loginError{
            color:#ff6b6b;
            font-size:.82rem;
            text-align:center;
            margin-top:.9rem;
            min-height:1.1rem;
        }

    </style>

</head>
<body>

    <div class="login-card">

        <div class="login-logo">🐞 BugWar Admin</div>
        <div class="login-sub">Sign in to access the command center</div>

        <form id="loginForm">

            <div class="login-field">
                <label for="username">Username</label>
                <input type="text" id="username" autocomplete="username" required>
            </div>

            <div class="login-field">
                <label for="password">Password</label>
                <input type="password" id="password" autocomplete="current-password" required>
            </div>

            <button type="submit" id="loginBtn">Login</button>

            <div id="loginError"></div>

        </form>

    </div>

    <script src="js/adminlogin.js"></script>

</body>
</html>
